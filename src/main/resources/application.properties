# Default Profile
spring.profiles.active=prod

# Common Configuration
spring.thymeleaf.cache=false
spring.threads.virtual.enabled=true

# Print Server Configuration (LAN Bridge)
app.print-server.url=http://192.168.1.53:8080
app.print-server.connect-timeout-ms=1500
app.print-server.read-timeout-ms=5000
app.print-server.hide-server-print-on-workstation=true
app.print-server.hide-client-print-on-remote=true

