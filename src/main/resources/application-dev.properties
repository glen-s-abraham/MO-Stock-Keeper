# Server Configuration (HTTP - SSL terminated by Cloudflare Tunnel when remote)
server.port=8443
server.ssl.enabled=false
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=password
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=mushroom-dev

# Database Configuration (H2 File-based)
spring.datasource.url=jdbc:h2:mem:mushroomdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.mushroom.stockkeeper=DEBUG

# Print Server Configuration (LAN Bridge)
app.print-server.url=http://192.168.1.53:8080
app.print-server.connect-timeout-ms=3000
app.print-server.read-timeout-ms=15000
app.print-server.hide-server-print-on-workstation=true
app.print-server.hide-client-print-on-remote=true

