<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>New Product</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="d-flex align-items-center mb-4">
                    <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm me-3"><i
                            class="bi bi-arrow-left fs-5"></i></a>
                    <h3 class="mb-0" th:text="${product.id == null ? 'Create Product' : 'Edit Product'}">Product Form
                    </h3>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="@{/products/save}" th:object="${product}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            <h6 class="text-uppercase text-muted fw-bold small mb-4">Product Details</h6>

                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label text-muted small">Product Name</label>
                                    <input type="text" class="form-control form-control-lg" th:field="*{name}"
                                        placeholder="e.g. Button Mushroom" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label text-muted small">SKU</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted"><i
                                                class="bi bi-barcode"></i></span>
                                        <input type="text" class="form-control ps-2" th:field="*{sku}"
                                            placeholder="e.g. BM-001" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label text-muted small">Unit of Measure</label>
                                    <select class="form-select" th:field="*{uom}" required>
                                        <option value="">Select UOM...</option>
                                        <option th:each="u : ${uoms}" th:value="${u.id}"
                                            th:text="${u.code + ' - ' + u.description}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label text-muted small">Default Expiry (Days)</label>
                                    <input type="number" class="form-control" th:field="*{defaultExpiryDays}" value="7">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label text-muted small">Retail Price (Base)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted">₹</span>
                                        <input type="number" step="0.01" class="form-control ps-2"
                                            th:field="*{retailPrice}" placeholder="0.00">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted">₹</span>
                                        <input type="number" step="0.01" class="form-control ps-2"
                                            th:field="*{wholesalePrice}" placeholder="0.00">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label text-muted small">MRP (Label Price)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted">₹</span>
                                        <input type="number" step="0.01" class="form-control ps-2" th:field="*{mrp}"
                                            placeholder="0.00">
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label text-muted small">Net Weight (For Label)</label>
                                    <div class="input-group">
                                        <input type="number" step="0.01" class="form-control" th:field="*{netWeight}"
                                            placeholder="200">
                                        <select class="form-select" th:field="*{netWeightUom}" style="max-width: 100px;">
                                            <option value="">Unit</option>
                                            <option value="g">g</option>
                                            <option value="kg">kg</option>
                                            <option value="ml">ml</option>
                                            <option value="L">L</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label text-muted small">Description</label>
                                    <textarea class="form-control" th:field="*{description}" rows="2"
                                        placeholder="Optional description..."></textarea>
                                </div>

                                <div class="col-12">
                                    <label class="form-label text-muted small">Storage Instructions (For Label)</label>
                                    <input type="text" class="form-control" th:field="*{storageInstructions}"
                                        placeholder="e.g. Keep Refrigerated at 4°C">
                                </div>

                                <div class="col-12">
                                    <label class="form-label text-muted small">FSSAI License No. (Optional)</label>
                                    <input type="text" class="form-control" th:field="*{fssaiLicenseNumber}"
                                        placeholder="e.g. 10012345678901">
                                </div>
                            </div>
                            
                            <!-- Nutrition Settings (US1 & US2) -->
                            <h6 class="text-uppercase text-muted fw-bold small mt-5 mb-4 border-top pt-4">Nutrition Information</h6>
                            
                            <div class="row g-3">
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="hasNutritionValues" th:field="*{hasNutritionValues}">
                                        <label class="form-check-label text-muted small" for="hasNutritionValues">Enable Nutrition Values as Line Items</label>
                                    </div>
                                </div>
                                
                                <div id="nutritionConfig" class="col-12 row g-3" style="display: none;">
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Base Unit Value</label>
                                        <input type="number" step="0.01" class="form-control" th:field="*{nutritionBaseUnitValue}" placeholder="e.g. 100">
                                        <div class="text-danger small" th:if="${#fields.hasErrors('nutritionBaseUnitValue')}" th:errors="*{nutritionBaseUnitValue}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Base Unit Type</label>
                                        <select class="form-select" th:field="*{nutritionBaseUnitType}">
                                            <option value="">Select Unit...</option>
                                            <option value="g">g</option>
                                            <option value="ml">ml</option>
                                        </select>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('nutritionBaseUnitType')}" th:errors="*{nutritionBaseUnitType}"></div>
                                    </div>
                                    
                                    <div class="col-12 mt-4">
                                        <label class="form-label text-muted small fw-bold">Nutrition Table</label>
                                        <div class="table-responsive">
                                            <table class="table table-bordered table-sm" id="nutritionTable">
                                                <thead class="table-light">
                                                    <tr>
                                                        <th>Component Name</th>
                                                        <th>Amount</th>
                                                        <th>Unit</th>
                                                        <th class="text-center">Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr th:each="item, stat : *{nutritionLineItems}">
                                                        <td>
                                                            <input type="hidden" th:field="*{nutritionLineItems[__${stat.index}__].id}">
                                                            <input type="hidden" th:field="*{nutritionLineItems[__${stat.index}__].version}">
                                                            <input type="text" class="form-control form-control-sm" th:field="*{nutritionLineItems[__${stat.index}__].componentName}" required>
                                                        </td>
                                                        <td>
                                                            <input type="number" step="0.01" class="form-control form-control-sm" th:field="*{nutritionLineItems[__${stat.index}__].amount}" required>
                                                        </td>
                                                        <td>
                                                            <input type="text" class="form-control form-control-sm" th:field="*{nutritionLineItems[__${stat.index}__].measurementUnit}" required>
                                                        </td>
                                                        <td class="text-center">
                                                            <button type="button" class="btn btn-sm btn-outline-danger btn-remove-row"><i class="bi bi-trash"></i></button>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                                <tfoot>
                                                    <tr>
                                                        <td colspan="4" class="text-center">
                                                            <button type="button" class="btn btn-sm btn-outline-primary" id="btnAddNutritionRow"><i class="bi bi-plus-circle"></i> Add Row</button>
                                                        </td>
                                                    </tr>
                                                </tfoot>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-5">
                                <button type="submit" class="btn btn-primary btn-lg">Save Product</button>
                                <a th:href="@{/products}"
                                    class="btn btn-link text-muted text-decoration-none">Cancel</a>
                            </div>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const hasNutritionValues = document.getElementById('hasNutritionValues');
                const nutritionConfig = document.getElementById('nutritionConfig');
                
                function toggleNutritionConfig() {
                    nutritionConfig.style.display = hasNutritionValues.checked ? 'flex' : 'none';
                }
                
                hasNutritionValues.addEventListener('change', toggleNutritionConfig);
                toggleNutritionConfig(); // initial state

                const btnAddNutritionRow = document.getElementById('btnAddNutritionRow');
                const nutritionTableBody = document.querySelector('#nutritionTable tbody');

                btnAddNutritionRow.addEventListener('click', function () {
                    const rowCount = nutritionTableBody.querySelectorAll('tr').length;
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td>
                            <input type="text" class="form-control form-control-sm" name="nutritionLineItems[${rowCount}].componentName" required>
                        </td>
                        <td>
                            <input type="number" step="0.01" class="form-control form-control-sm" name="nutritionLineItems[${rowCount}].amount" required>
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm" name="nutritionLineItems[${rowCount}].measurementUnit" required>
                        </td>
                        <td class="text-center">
                            <button type="button" class="btn btn-sm btn-outline-danger btn-remove-row"><i class="bi bi-trash"></i></button>
                        </td>
                    `;
                    nutritionTableBody.appendChild(tr);
                });

                nutritionTableBody.addEventListener('click', function (e) {
                    if (e.target.closest('.btn-remove-row')) {
                        e.target.closest('tr').remove();
                        // Re-index remaining rows
                        const rows = nutritionTableBody.querySelectorAll('tr');
                        rows.forEach((row, index) => {
                            const inputs = row.querySelectorAll('input');
                            inputs.forEach(input => {
                                const name = input.getAttribute('name');
                                if (name) {
                                    input.setAttribute('name', name.replace(/\[\d+\]/, `[${index}]`));
                                }
                            });
                        });
                    }
                });
            });
        </script>
    </th:block>
</body>

</html>
