<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Print Labels</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        @media print {
            @page {
                size: auto;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .no-print {
                display: none;
            }

            .page-break {
                page-break-after: always;
            }
        }

        /* Default Grid (A4_40) fallback */
        .label-grid {
            display: grid;
            gap: 0;
            padding: 0;
        }

        .label-item {
            border: 1px dashed #ccc;
            padding: 1px;
            text-align: center;
            page-break-inside: avoid;
            background: white;
            overflow: hidden;
        }

        /* A4 - 24 Labels (3x8) */
        .sheet-A4_24 .label-grid {
            grid-template-columns: repeat(3, 1fr);
        }

        /* A4 - 40 Labels (4x10) */
        .sheet-A4_40 .label-grid {
            grid-template-columns: repeat(4, 1fr);
        }

        /* Thermal - 4x6" (100x150mm) */
        .sheet-THERMAL_4x6 {
            width: 100mm;
        }

        .sheet-THERMAL_4x6 .label-grid {
            grid-template-columns: 1fr;
            gap: 0;
            padding: 0;
        }

        .sheet-THERMAL_4x6 .label-item {
            width: 100mm;
            height: 150mm;
            border: none;
            padding: 5mm;
            page-break-after: always;
            display: flex;
            /* Center vertically for thermal */
            flex-direction: column;
            justify-content: center;
        }

        /* Thermal - 2x1" (50x25mm) */
        .sheet-THERMAL_2x1 {
            width: 50mm;
        }

        .sheet-THERMAL_2x1 .label-grid {
            grid-template-columns: 1fr;
            gap: 0;
            padding: 0;
        }

        .sheet-THERMAL_2x1 .label-item {
            width: 50mm;
            height: 25mm;
            border: none;
            /* No border for small thermal */
            padding: 1mm;
            page-break-after: always;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Adjust font sizes for tiny labels */
        .sheet-THERMAL_2x1 .label-item .qr-img {
            max-width: 14mm;
            max-height: 14mm;
            width: auto;
            height: auto;
        }

        .sheet-THERMAL_2x1 .label-item .fw-bold {
            font-size: 6pt !important;
        }

        .sheet-THERMAL_2x1 .label-item div {
            font-size: 5pt !important;
            line-height: 1.1;
        }

        /* Custom Thermal */
        .sheet-THERMAL_CUSTOM .label-grid {
            grid-template-columns: 1fr;
            gap: 0;
            padding: 0;
        }

        .sheet-THERMAL_CUSTOM .label-item {
            border: none;
            padding: 1mm;
            page-break-after: always;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>

    <style th:if="${labelSheetSize == 'THERMAL_CUSTOM'}" th:utext="'
        @page {
            size: ' + ${customLabelWidth} + 'mm ' + ${customLabelHeight} + 'mm;
            margin: 0;
        }
        .sheet-THERMAL_CUSTOM {
            width: ' + ${customLabelWidth} + 'mm;
        }
        .sheet-THERMAL_CUSTOM .label-item {
            width: ' + ${customLabelWidth} + 'mm;
            height: ' + ${customLabelHeight} + 'mm;
        }
    '"></style>

    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
</head>

<body th:class="'sheet-' + ${labelSheetSize != null ? labelSheetSize : 'A4_40'}">
    <div class="container-fluid">
        <div class="no-print d-flex justify-content-between align-items-center bg-light p-3 border-bottom mb-2">
            <div>
                <h4 class="mb-0">Batch: <span th:text="${batch.batchCode}"></span></h4>
                <small class="text-muted" th:text="${batch.product.name}"></small>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span id="serverPrintControls"
                      class="d-inline-flex align-items-center gap-2"
                      th:classappend="${(hideServerPrint != null and hideServerPrint) or (hideServerPrint == null and sameMachineAsPrintServer != null and sameMachineAsPrintServer)} ? 'd-none' : ''">
                    <span id="printServerStatusBadge"
                          th:class="${printServerAvailable != null and printServerAvailable} ? 'badge bg-success' : 'badge bg-secondary'"
                          th:title="${printServerMessage}"
                          th:text="${printServerAvailable != null and printServerAvailable} ? 'Print Server: Online' : 'Print Server: Offline'">
                        Print Server: Offline
                    </span>
                    <button id="serverPrintBtn"
                            type="button"
                            onclick="triggerServerPrint()"
                            class="btn btn-success"
                            th:disabled="${printServerAvailable == null or !printServerAvailable}"
                            th:title="${printServerMessage != null ? printServerMessage : 'Server-side LAN printing'}">
                        <i class="bi bi-cloud-upload-fill me-2"></i><span id="serverPrintBtnText">Server Print</span>
                    </button>
                </span>
                <button id="clientPrintBtn"
                        type="button"
                        onclick="window.print()"
                        class="btn btn-primary"
                        th:classappend="${hideClientPrint != null and hideClientPrint} ? 'd-none' : ''"
                        th:disabled="${hideClientPrint != null and hideClientPrint}"><i
                        class="bi bi-printer-fill me-2"></i>Print</button>
                <a th:href="@{/batches/{id}(id=${batch.id})}" class="btn btn-outline-secondary">Back</a>
            </div>
        </div>
        <div id="serverPrintFeedback" class="no-print alert d-none mb-3" role="alert"></div>

        <div class="label-grid">
            <div th:each="u : ${units}" class="label-item">
                <div class="d-flex flex-column" style="text-align: left; font-size: 14pt; line-height: 1.05;">
                    <!-- Top section: Veg symbol, Product Name, FSSAI -->
                    <div class="d-flex justify-content-between align-items-start w-100 mb-0">
                        <div class="border border-success d-flex justify-content-center align-items-center" style="width: 10mm; height: 10mm; min-width: 10mm; margin: 1.5mm 1.5mm 4mm 1.5mm; border-width: 2px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                            <div class="bg-success rounded-circle" style="width: 5mm; height: 5mm; -webkit-print-color-adjust: exact; print-color-adjust: exact;"></div>
                        </div>
                        <div class="text-center flex-grow-1 px-1">
                            <div class="fw-bold" style="font-size: 13pt;" th:text="${batch.product.name}">PROD</div>
                            <div th:if="${batch.product.fssaiLicenseNumber != null}" class="fw-bold" style="font-size: 9pt;" th:text="'FSSAI Lic No: ' + ${batch.product.fssaiLicenseNumber}">FSSAI</div>
                        </div>
                        <!-- QR Code removed per FR-009 -->
                        <div style="display: none;">
                            <img th:src="'data:image/png;base64,' + ${qrCodes.get(u.id)}" class="qr-img" style="max-height: 25mm; width: auto; margin: 0;" />
                        </div>
                    </div>

                    <!-- Company Info -->
                    <div class="row g-0 mb-0 border-top" style="font-size: 9pt;">
                        <div class="col-6 pe-1">
                            <strong>GROWN & PACKED BY:</strong><br>
                            <span th:text="${companyName}">Mushroom Operations</span><br>
                            <span style="font-size: 8pt;" th:text="${registeredOfficeAddress}">Address</span>
                        </div>
                        <div class="col-6 ps-1 border-start">
                            <strong>CUSTOMER CARE:</strong><br>
                            <span style="font-size: 8pt;" th:text="${customerCareAddress}">Address</span><br>
                            <span class="fw-bold" style="font-size: 10pt;" th:text="'Tel: ' + ${contactNumber}">Contact</span>
                        </div>
                    </div>

                    <!-- Batch & Product Details -->
                    <div class="row g-0 mb-0 border-top border-bottom">
                        <div class="col-6 pe-1">
                            Batch No: <span class="fw-bold" th:text="${batch.batchCode}"></span><br>
                            Pkd: <span class="fw-bold" style="font-size: 10pt;" th:text="${batch.batchDate}"></span><br>
                            Exp: <span class="fw-bold text-uppercase" style="font-size: 10pt;" th:text="${batch.expiryDate}"></span>
                        </div>
                        <div class="col-6 border-start ps-1">
                            Net Wt: <span class="fw-bold" th:text="${batch.product.netWeight != null ? batch.product.netWeight + (batch.product.netWeightUom != null ? batch.product.netWeightUom : '') : ''}">200g</span><br>
                            <span th:if="${batch.product.mrp != null}" th:text="'MRP: ₹' + ${batch.product.mrp} + ' (Incl. taxes)'">MRP</span>
                        </div>
                    </div>
                    

                    <!-- Nutrition Table (Conditional) -->
                    <th:block th:with="showNutrition=${batch.product.hasNutritionValues and ((labelSheetSize == 'THERMAL_CUSTOM' and customLabelWidth >= 75 and customLabelHeight >= 75) or labelSheetSize == 'THERMAL_4x6')}">
                        <div th:if="${showNutrition}" class="mt-1 w-100">
                            <table class="table table-sm table-bordered nutrition-table mb-0 w-100" style="font-size: 11pt; border-color: #000;">
                                <thead>
                                    <tr>
                                        <th colspan="2" class="text-center p-1 bg-light m-0 border-bottom-0">NUTRITIONAL INFORMATION (Approx. per <span th:text="${batch.product.nutritionBaseUnitValue + batch.product.nutritionBaseUnitType}">100g</span>)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${batch.product.nutritionLineItems}">
                                        <td class="p-1 m-0" style="width: 60%; border-top: none;" th:text="${item.componentName}">Component</td>
                                        <td class="p-1 m-0 text-end" style="width: 40%; border-top: none;" th:text="${item.amount + item.measurementUnit}">0g</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </th:block>
                    
                    <!-- Storage Instructions -->
                    <div th:if="${batch.product.storageInstructions != null and !batch.product.storageInstructions.isEmpty()}" class="border border-dark p-2 mt-1 text-center w-100" style="font-size: 11pt; border-style: dashed !important; border-width: 2px !important; border-radius: 2px; overflow-wrap: break-word; word-wrap: break-word; box-sizing: border-box;" th:text="${batch.product.storageInstructions}">Storage</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            autoFitLabels();
        });

        // Also run on window load to ensure images are loaded
        window.addEventListener("load", function () {
            autoFitLabels();
        });

        function autoFitLabels() {
            const labels = document.querySelectorAll('.label-item');
            labels.forEach(label => {
                const content = label.querySelector('div'); // The inner d-flex wrapper
                if (content) {
                    // Reset transform to get natural size
                    content.style.transform = 'none';
                    content.style.marginLeft = '0';
                    content.style.marginTop = '0';

                    // Get computed styles to check padding
                    const style = window.getComputedStyle(label);
                    const paddingVertical = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
                    const paddingHorizontal = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);

                    // Force parent to top-left alignment so it doesn't offset the unscaled block
                    label.style.justifyContent = 'flex-start';
                    label.style.alignItems = 'flex-start';

                    const availHeight = label.clientHeight - paddingVertical;
                    const availWidth = label.clientWidth - paddingHorizontal;
                    
                    if (availHeight <= 0 || availWidth <= 0) return;

                    const targetRatio = availWidth / availHeight;
                    
                    // Binary search for the optimal virtual width
                    let minW = 10;
                    let maxW = 4000;
                    let bestW = availWidth;
                    
                    for (let i = 0; i < 20; i++) {
                        let midW = (minW + maxW) / 2;
                        content.style.width = midW + 'px';
                        
                        let currentW = content.scrollWidth;
                        let currentH = content.scrollHeight;
                        let ratio = currentW / currentH;
                        
                        if (ratio > targetRatio) {
                            // Aspect ratio is too wide (short and fat). We need it to be taller, so decrease width to force more wrapping.
                            maxW = midW;
                        } else {
                            // Aspect ratio is too narrow (tall and thin). We need it to be shorter, so increase width to force less wrapping.
                            minW = midW;
                        }
                        bestW = midW;
                    }
                    
                    // Apply optimal width
                    content.style.width = bestW + 'px';
                    
                    const finalW = content.scrollWidth;
                    const finalH = content.scrollHeight;

                    // Calculate scale factors
                    const scaleW = availWidth / finalW;
                    const scaleH = availHeight / finalH;

                    // Use the smaller scale to fit both dimensions, with a solid 5% buffer
                    const scale = Math.min(scaleW, scaleH) * 0.95;

                    content.style.transformOrigin = 'top left';
                    content.style.transform = `scale(${scale})`;
                    
                    // Center the scaled content precisely
                    const scaledW = finalW * scale;
                    const scaledH = finalH * scale;
                    const leftMargin = (availWidth - scaledW) / 2;
                    const topMargin = (availHeight - scaledH) / 2;
                    
                    content.style.marginLeft = leftMargin + 'px';
                    content.style.marginTop = topMargin + 'px';
                }
            });
        }
    </script>
    <script th:inline="javascript">
        const batchId = /*[[${batch.id}]]*/ 0;
        const statusEndpointUrl = /*[[@{/batches/print-server/status}]]*/ '/batches/print-server/status';
        const serverPrintBaseUrl = /*[[@{/batches/{id}/server-print(id=${batch.id})}]]*/ '/batches/0/server-print';
        const initialHideServerPrintOnWorkstation = /*[[${hideServerPrintOnWorkstation != null ? hideServerPrintOnWorkstation : true}]]*/ true;
        const initialHideClientPrintOnRemote = /*[[${hideClientPrintOnRemote != null ? hideClientPrintOnRemote : true}]]*/ true;

        const initialPrintServerAvailable = /*[[${printServerAvailable != null ? printServerAvailable : false}]]*/ false;
        let statusPollTimer = null;

        document.addEventListener("DOMContentLoaded", function () {
            refreshPrintServerStatus();
        });

        async function isCurrentMachinePrintServerWorkstation() {
            // Check if the browser is running on the workstation where H30PrintServer is listening on 127.0.0.1:8080
            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 600);
                const localResp = await fetch('http://127.0.0.1:8080/', {
                    method: 'GET',
                    mode: 'cors',
                    signal: controller.signal
                });
                clearTimeout(timer);
                if (localResp.ok) {
                    const info = await localResp.json();
                    if (info && info.status === 'online' && info.printer) {
                        return true;
                    }
                }
            } catch (ignored) {
                // Not running H30PrintServer locally on 127.0.0.1:8080
            }
            return false;
        }

        function applyPrintButtonsVisibility(isWorkstation, hideServerOnWorkstation, hideClientOnRemote) {
            const controls = document.getElementById('serverPrintControls');
            const serverBtn = document.getElementById('serverPrintBtn');
            const clientBtn = document.getElementById('clientPrintBtn');

            if (isWorkstation) {
                if (controls && serverBtn) {
                    if (hideServerOnWorkstation) {
                        controls.classList.add('d-none');
                        serverBtn.disabled = true;
                    } else {
                        controls.classList.remove('d-none');
                    }
                }
                if (clientBtn) {
                    clientBtn.classList.remove('d-none');
                    clientBtn.disabled = false;
                }
            } else {
                if (controls) {
                    controls.classList.remove('d-none');
                }
                if (clientBtn) {
                    if (hideClientOnRemote) {
                        clientBtn.classList.add('d-none');
                        clientBtn.disabled = true;
                    } else {
                        clientBtn.classList.remove('d-none');
                        clientBtn.disabled = false;
                    }
                }
            }
        }

        function scheduleStatusRecheckIfOffline(isAvailable, isWorkstation, hideServerOnWorkstation) {
            if (statusPollTimer) {
                clearTimeout(statusPollTimer);
                statusPollTimer = null;
            }
            if (!isAvailable && !(isWorkstation && hideServerOnWorkstation)) {
                statusPollTimer = setTimeout(() => refreshPrintServerStatus(), 8000);
            }
        }

        async function fetchBackendPrintStatus() {
            try {
                const resp = await fetch(statusEndpointUrl, {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: { 'Accept': 'application/json' }
                });
                if (resp.ok && !resp.redirected) {
                    return await resp.json();
                }
            } catch (ignored) {
            }
            return null;
        }

        async function refreshPrintServerStatus() {
            const controls = document.getElementById('serverPrintControls');
            const btn = document.getElementById('serverPrintBtn');
            const badge = document.getElementById('printServerStatusBadge');
            if (!btn || !badge || !controls) return;

            const [isLocalWorkstation, data] = await Promise.all([
                isCurrentMachinePrintServerWorkstation(),
                fetchBackendPrintStatus()
            ]);

            if (data) {
                const isWorkstation = Boolean(isLocalWorkstation || data.sameMachineAsPrintServer);
                const hideServerOnWorkstation = data.hideServerPrintOnWorkstation !== undefined
                    ? Boolean(data.hideServerPrintOnWorkstation)
                    : Boolean(initialHideServerPrintOnWorkstation);
                const hideClientOnRemote = data.hideClientPrintOnRemote !== undefined
                    ? Boolean(data.hideClientPrintOnRemote)
                    : Boolean(initialHideClientPrintOnRemote);

                applyPrintButtonsVisibility(isWorkstation, hideServerOnWorkstation, hideClientOnRemote);
                if (isWorkstation && hideServerOnWorkstation) {
                    return;
                }

                btn.disabled = !data.available;
                btn.title = data.message || '';
                badge.title = data.message || '';
                if (data.available) {
                    badge.className = 'badge bg-success';
                    badge.textContent = 'Print Server: Online';
                } else {
                    badge.className = 'badge bg-secondary';
                    badge.textContent = 'Print Server: Offline';
                }
                scheduleStatusRecheckIfOffline(Boolean(data.available), isWorkstation, hideServerOnWorkstation);
                return;
            }

            const hideServerOnWorkstation = Boolean(initialHideServerPrintOnWorkstation);
            const hideClientOnRemote = Boolean(initialHideClientPrintOnRemote);
            applyPrintButtonsVisibility(isLocalWorkstation, hideServerOnWorkstation, hideClientOnRemote);
            if (!isLocalWorkstation || !hideServerOnWorkstation) {
                if (!initialPrintServerAvailable) {
                    btn.disabled = true;
                    badge.className = 'badge bg-secondary';
                    badge.textContent = 'Print Server: Offline';
                }
                scheduleStatusRecheckIfOffline(false, isLocalWorkstation, hideServerOnWorkstation);
            }
        }

        async function triggerServerPrint() {
            const btn = document.getElementById('serverPrintBtn');
            const btnText = document.getElementById('serverPrintBtnText');
            const feedback = document.getElementById('serverPrintFeedback');
            if (!btn || btn.disabled) return;

            btn.disabled = true;
            if (btnText) btnText.textContent = 'Printing...';
            if (feedback) {
                feedback.className = 'no-print alert alert-info mb-3';
                feedback.textContent = 'Generating multi-page PDF and sending to LAN print server...';
            }

            try {
                const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
                const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
                const headers = { 'Accept': 'application/json' };
                if (csrfTokenMeta && csrfHeaderMeta) {
                    headers[csrfHeaderMeta.getAttribute('content')] = csrfTokenMeta.getAttribute('content');
                }

                const searchParams = new URLSearchParams(window.location.search);
                const targetUrl = searchParams.toString()
                    ? `${serverPrintBaseUrl}?${searchParams.toString()}`
                    : serverPrintBaseUrl;

                const resp = await fetch(targetUrl, {
                    method: 'POST',
                    headers: headers
                });

                const result = await resp.json();
                if (resp.ok && result.success) {
                    if (feedback) {
                        feedback.className = 'no-print alert alert-success mb-3';
                        feedback.textContent = result.message || 'Labels sent to print server successfully.';
                    }
                    btn.disabled = false;
                } else {
                    if (feedback) {
                        feedback.className = 'no-print alert alert-danger mb-3';
                        feedback.textContent = (result && result.message) ? result.message : 'Server-side print failed.';
                    }
                    await refreshPrintServerStatus();
                }
            } catch (err) {
                if (feedback) {
                    feedback.className = 'no-print alert alert-danger mb-3';
                    feedback.textContent = 'Error communicating with server: ' + err.message;
                }
                await refreshPrintServerStatus();
            } finally {
                if (btnText) btnText.textContent = 'Server Print';
            }
        }
    </script>
</body>

</html>
