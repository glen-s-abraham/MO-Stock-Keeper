<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Print Labels</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        @media print {
            @page {
                size: auto;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .no-print {
                display: none;
            }

            .page-break {
                page-break-after: always;
            }
        }

        /* Default Grid (A4_40) fallback */
        .label-grid {
            display: grid;
            gap: 0;
            padding: 0;
        }

        .label-item {
            border: 1px dashed #ccc;
            padding: 1px;
            text-align: center;
            page-break-inside: avoid;
            background: white;
            overflow: hidden;
        }

        /* A4 - 24 Labels (3x8) */
        .sheet-A4_24 .label-grid {
            grid-template-columns: repeat(3, 1fr);
        }

        /* A4 - 40 Labels (4x10) */
        .sheet-A4_40 .label-grid {
            grid-template-columns: repeat(4, 1fr);
        }

        /* Thermal - 4x6" (100x150mm) */
        .sheet-THERMAL_4x6 {
            width: 100mm;
        }

        .sheet-THERMAL_4x6 .label-grid {
            grid-template-columns: 1fr;
            gap: 0;
            padding: 0;
        }

        .sheet-THERMAL_4x6 .label-item {
            width: 100mm;
            height: 150mm;
            border: none;
            padding: 5mm;
            page-break-after: always;
            display: flex;
            /* Center vertically for thermal */
            flex-direction: column;
            justify-content: center;
        }

        /* Thermal - 2x1" (50x25mm) */
        .sheet-THERMAL_2x1 {
            width: 50mm;
        }

        .sheet-THERMAL_2x1 .label-grid {
            grid-template-columns: 1fr;
            gap: 0;
            padding: 0;
        }

        .sheet-THERMAL_2x1 .label-item {
            width: 50mm;
            height: 25mm;
            border: none;
            /* No border for small thermal */
            padding: 1mm;
            page-break-after: always;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Adjust font sizes for tiny labels */
        .sheet-THERMAL_2x1 .label-item .qr-img {
            max-width: 14mm;
            max-height: 14mm;
            width: auto;
            height: auto;
        }

        .sheet-THERMAL_2x1 .label-item .fw-bold {
            font-size: 6pt !important;
        }

        .sheet-THERMAL_2x1 .label-item div {
            font-size: 5pt !important;
            line-height: 1.1;
        }

        /* Custom Thermal */
        .sheet-THERMAL_CUSTOM .label-grid {
            grid-template-columns: 1fr;
            gap: 0;
            padding: 0;
        }

        .sheet-THERMAL_CUSTOM .label-item {
            border: none;
            padding: 0mm;
            page-break-after: always;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>

    <style th:if="${labelSheetSize == 'THERMAL_CUSTOM'}" th:utext="'
        @page {
            size: ' + ${customLabelWidth} + 'mm ' + ${customLabelHeight} + 'mm;
            margin: 0;
        }
        .sheet-THERMAL_CUSTOM {
            width: ' + ${customLabelWidth} + 'mm;
        }
        .sheet-THERMAL_CUSTOM .label-item {
            width: ' + ${customLabelWidth} + 'mm;
            height: ' + ${customLabelHeight} + 'mm;
        }
    '"></style>

</head>

<body th:class="'sheet-' + ${labelSheetSize != null ? labelSheetSize : 'A4_40'}">
    <div class="container-fluid">
        <div class="no-print d-flex justify-content-between align-items-center bg-light p-3 border-bottom mb-4">
            <div>
                <h4 class="mb-0">Batch: <span th:text="${batch.batchCode}"></span></h4>
                <small class="text-muted" th:text="${batch.product.name}"></small>
            </div>
            <div>
                <button onclick="window.print()" class="btn btn-primary"><i
                        class="bi bi-printer-fill me-2"></i>Print</button>
                <a th:href="@{/batches/{id}(id=${batch.id})}" class="btn btn-outline-secondary">Back</a>
            </div>
        </div>

        <div class="label-grid">
            <div th:each="u : ${units}" class="label-item">
                <div class="d-flex flex-column" style="text-align: left; font-size: 14pt; line-height: 1.05;">
                    <!-- Top section: Veg symbol, Product Name, FSSAI -->
                    <div class="d-flex justify-content-between align-items-start w-100 mb-0">
                        <div class="border border-success d-flex justify-content-center align-items-center" style="width: 10mm; height: 10mm; min-width: 10mm; margin: 1.5mm 1.5mm 4mm 1.5mm; border-width: 2px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                            <div class="bg-success rounded-circle" style="width: 5mm; height: 5mm; -webkit-print-color-adjust: exact; print-color-adjust: exact;"></div>
                        </div>
                        <div class="text-center flex-grow-1 px-1">
                            <div class="fw-bold" style="font-size: 13pt;" th:text="${batch.product.name}">PROD</div>
                            <div th:if="${batch.product.fssaiLicenseNumber != null}" class="fw-bold" style="font-size: 9pt;" th:text="'FSSAI Lic No: ' + ${batch.product.fssaiLicenseNumber}">FSSAI</div>
                        </div>
                        <!-- QR Code removed per FR-009 -->
                        <div style="display: none;">
                            <img th:src="'data:image/png;base64,' + ${qrCodes.get(u.id)}" class="qr-img" style="max-height: 25mm; width: auto; margin: 0;" />
                        </div>
                    </div>

                    <!-- Company Info -->
                    <div class="row g-0 mb-0 border-top" style="font-size: 9pt;">
                        <div class="col-6 pe-1">
                            <strong>GROWN & PACKED BY:</strong><br>
                            <span th:text="${companyName}">Mushroom Operations</span><br>
                            <span style="font-size: 8pt;" th:text="${registeredOfficeAddress}">Address</span>
                        </div>
                        <div class="col-6 ps-1 border-start">
                            <strong>CUSTOMER CARE:</strong><br>
                            <span style="font-size: 8pt;" th:text="${customerCareAddress}">Address</span><br>
                            <span class="fw-bold" style="font-size: 10pt;" th:text="'Tel: ' + ${contactNumber}">Contact</span>
                        </div>
                    </div>

                    <!-- Batch & Product Details -->
                    <div class="row g-0 mb-0 border-top border-bottom">
                        <div class="col-6 pe-1">
                            Batch No: <span class="fw-bold" th:text="${batch.batchCode}"></span><br>
                            Pkd: <span class="fw-bold" style="font-size: 10pt;" th:text="${batch.batchDate}"></span><br>
                            Exp: <span class="fw-bold text-uppercase" style="font-size: 10pt;" th:text="${batch.expiryDate}"></span>
                        </div>
                        <div class="col-6 border-start ps-1">
                            Net Wt: <span class="fw-bold" th:text="${batch.product.netWeight != null ? batch.product.netWeight + (batch.product.netWeightUom != null ? batch.product.netWeightUom : '') : ''}">200g</span><br>
                            <span th:if="${batch.product.mrp != null}" th:text="'MRP: ₹' + ${batch.product.mrp} + ' (Incl. taxes)'">MRP</span><br>
                            <span class="fst-italic fw-bold border border-dark px-1 bg-light d-inline-block" style="font-size: 9pt;" th:text="${batch.product.storageInstructions}">Storage</span>
                        </div>
                    </div>


                    <!-- Nutrition Table (Conditional) -->
                    <th:block th:with="showNutrition=${batch.product.hasNutritionValues and ((labelSheetSize == 'THERMAL_CUSTOM' and customLabelWidth >= 75 and customLabelHeight >= 75) or labelSheetSize == 'THERMAL_4x6')}">
                        <div th:if="${showNutrition}" class="mt-1 w-100">
                            <table class="table table-sm table-bordered nutrition-table mb-0 w-100" style="font-size: 6pt; border-color: #000;">
                                <thead>
                                    <tr>
                                        <th colspan="2" class="text-center p-1 bg-light m-0 border-bottom-0">NUTRITIONAL INFORMATION (Approx. per <span th:text="${batch.product.nutritionBaseUnitValue + batch.product.nutritionBaseUnitType}">100g</span>)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${batch.product.nutritionLineItems}">
                                        <td class="p-1 m-0" style="width: 60%; border-top: none;" th:text="${item.componentName}">Component</td>
                                        <td class="p-1 m-0 text-end" style="width: 40%; border-top: none;" th:text="${item.amount + item.measurementUnit}">0g</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            autoFitLabels();
        });

        // Also run on window load to ensure images are loaded
        window.addEventListener("load", function () {
            autoFitLabels();
        });

        function autoFitLabels() {
            const labels = document.querySelectorAll('.label-item');
            labels.forEach(label => {
                const content = label.querySelector('div'); // The inner d-flex wrapper
                if (content) {
                    // Reset transform to get natural size
                    content.style.transform = 'none';
                    content.style.marginLeft = '0';
                    content.style.marginTop = '0';

                    // Get computed styles to check padding
                    const style = window.getComputedStyle(label);
                    const paddingVertical = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
                    const paddingHorizontal = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);

                    // Force parent to top-left alignment so it doesn't offset the unscaled block
                    label.style.justifyContent = 'flex-start';
                    label.style.alignItems = 'flex-start';

                    const availHeight = label.clientHeight - paddingVertical;
                    const availWidth = label.clientWidth - paddingHorizontal;
                    
                    if (availHeight <= 0 || availWidth <= 0) return;

                    const targetRatio = availWidth / availHeight;
                    
                    // Binary search for the optimal virtual width
                    let minW = 10;
                    let maxW = 4000;
                    let bestW = availWidth;
                    
                    for (let i = 0; i < 20; i++) {
                        let midW = (minW + maxW) / 2;
                        content.style.width = midW + 'px';
                        
                        let currentW = content.scrollWidth;
                        let currentH = content.scrollHeight;
                        let ratio = currentW / currentH;
                        
                        if (ratio > targetRatio) {
                            // Aspect ratio is too wide (short and fat). We need it to be taller, so decrease width to force more wrapping.
                            maxW = midW;
                        } else {
                            // Aspect ratio is too narrow (tall and thin). We need it to be shorter, so increase width to force less wrapping.
                            minW = midW;
                        }
                        bestW = midW;
                    }
                    
                    // Apply optimal width
                    content.style.width = bestW + 'px';
                    
                    const finalW = content.scrollWidth;
                    const finalH = content.scrollHeight;

                    // Calculate scale factors
                    const scaleW = availWidth / finalW;
                    const scaleH = availHeight / finalH;

                    // Use the smaller scale to fit both dimensions, with a small 1% buffer
                    const scale = Math.min(scaleW, scaleH) * 0.99;

                    content.style.transformOrigin = 'top left';
                    content.style.transform = `scale(${scale})`;
                    
                    // Center the scaled content precisely
                    const scaledW = finalW * scale;
                    const scaledH = finalH * scale;
                    const leftMargin = (availWidth - scaledW) / 2;
                    const topMargin = (availHeight - scaledH) / 2;
                    
                    content.style.marginLeft = leftMargin + 'px';
                    content.style.marginTop = topMargin + 'px';
                }
            });
        }
    </script>
</body>

</html>
