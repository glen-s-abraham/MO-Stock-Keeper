<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title layout:title-pattern="$CONTENT_TITLE - MO Stock Keeper">MO Stock Keeper</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="shortcut icon" th:href="@{/favicon.svg}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#198754">

    <!-- Google Fonts: Outfit (Premium, Modern) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <!-- Bootstrap 5.3 CSS (Local) -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Bootstrap Icons (Local) -->
    <link th:href="@{/css/bootstrap-icons.min.css}" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet">

    <!-- Bootstrap JS Bundle -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/jquery.min.js}"></script>
    <!-- Html5-QRCode (Local) -->
    <script th:src="@{/js/html5-qrcode.min.js}"></script>

    <!-- Select2 (Local) -->
    <link th:href="@{/css/select2.min.css}" rel="stylesheet" />
    <link th:href="@{/css/select2-bootstrap-5-theme.min.css}" rel="stylesheet" />
    <script th:src="@{/js/select2.min.js}"></script>
    <style>
        .select2-container .select2-selection--single {
            height: 38px;
        }

        .select2-container--bootstrap-5 .select2-selection {
            border-color: #dee2e6;
        }

        /* Hide online-only navigation and dashboard items when in Offline Mode */
        body.is-offline .online-only-feature {
            display: none !important;
        }
    </style>

    <!-- Custom JS -->
    <script th:src="@{/js/scripts.js}"></script>
    <!-- Offline-First PWA & Outbox Sync Engine -->
    <script th:src="@{/js/offline-sync.js}"></script>
    
    <!-- Chart.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body class="pb-5 mb-5"> <!-- Padding for bottom nav -->

    <!-- Top Navbar (Desktop/Admin mainly) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/dashboard}">
                <i class="bi bi-box-seam-fill me-2"></i>MO Stock
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
                    <!-- 1. Home -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">
                            <i class="bi bi-house-door me-1"></i>Home
                        </a>
                    </li>

                    <!-- 2. Production & Inventory Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navProductionDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-box-seam me-1"></i>Production &amp; Stock
                        </a>
                        <ul class="dropdown-menu shadow-sm" aria-labelledby="navProductionDropdown">
                            <li>
                                <a class="dropdown-item" th:href="@{/batches}">
                                    <i class="bi bi-boxes me-2 text-success"></i>Harvest Batches
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/batches/manual-labels}">
                                    <i class="bi bi-printer me-2 text-primary"></i>Manual Labels
                                </a>
                            </li>
                            <li class="online-only-feature">
                                <a class="dropdown-item" th:href="@{/products}">
                                    <i class="bi bi-tags me-2 text-info"></i>Products
                                </a>
                            </li>
                            <li class="online-only-feature"><hr class="dropdown-divider"></li>
                            <li class="online-only-feature">
                                <a class="dropdown-item" th:href="@{/dashboard/harvest}">
                                    <i class="bi bi-graph-up-arrow me-2 text-success"></i>Harvest Dashboard
                                </a>
                            </li>
                        </ul>
                    </li>

                    <!-- 3. Procurement Scheduler Tab (ARPS) -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/procurement}">
                            <i class="bi bi-calendar2-range me-1"></i>Procurement
                        </a>
                    </li>

                    <!-- 4. Sales & Billing Dropdown (Online Only) -->
                    <li class="nav-item dropdown online-only-feature">
                        <a class="nav-link dropdown-toggle" href="#" id="navSalesDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-cart3 me-1"></i>Sales &amp; Billing
                        </a>
                        <ul class="dropdown-menu shadow-sm" aria-labelledby="navSalesDropdown">
                            <li>
                                <a class="dropdown-item" th:href="@{/sales}">
                                    <i class="bi bi-bag-check me-2 text-primary"></i>Sales Orders
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/invoices}">
                                    <i class="bi bi-receipt me-2 text-secondary"></i>Invoices
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/collections}">
                                    <i class="bi bi-cash-coin me-2 text-warning"></i>Collections
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/returns}">
                                    <i class="bi bi-arrow-return-left me-2 text-danger"></i>Returns
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item" th:href="@{/customers}">
                                    <i class="bi bi-people me-2 text-info"></i>Customers
                                </a>
                            </li>
                        </ul>
                    </li>

                    <!-- 5. Settings -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/settings}">
                            <i class="bi bi-gear me-1"></i>Settings
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <!-- Offline/Online PWA Status & Manual Sync Trigger -->
                    <span id="pwaConnectionBadge" class="badge bg-light text-success border px-2 py-1" title="Offline-First Sync Status">
                        <i class="bi bi-cloud-check me-1"></i>Online
                    </span>
                    <button id="pwaSyncNowBtn" type="button" class="btn btn-sm btn-warning d-none"
                            onclick="window.MoStockOfflineSync && window.MoStockOfflineSync.syncNow()">
                        <i class="bi bi-arrow-repeat me-1"></i>Sync Now
                    </button>
                    <span class="text-white me-2 small" th:if="${#authentication.principal != 'anonymousUser'}">
                        <i class="bi bi-person-circle me-1"></i><span th:text="${#authentication.name}">User</span>
                    </span>
                    <form th:action="@{/logout}" method="post" th:if="${#authentication.principal != 'anonymousUser'}">
                        <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-3" layout:fragment="content">
        <!-- Content goes here -->
    </div>

    <!-- Bottom Navigation (Mobile Only) -->
    <div class="mobile-nav-bottom d-lg-none d-flex justify-content-around py-2">
        <a th:href="@{/dashboard}" class="text-secondary text-center text-decoration-none">
            <i class="bi bi-speedometer2 nav-icon"></i>
            <small class="d-block" style="font-size: 0.7rem;">Home</small>
        </a>
        <a th:href="@{/batches}" class="text-secondary text-center text-decoration-none">
            <i class="bi bi-box-seam nav-icon"></i>
            <small class="d-block" style="font-size: 0.7rem;">Batches</small>
        </a>
        <a th:href="@{/procurement}" class="text-secondary text-center text-decoration-none">
            <i class="bi bi-calendar2-range nav-icon"></i>
            <small class="d-block" style="font-size: 0.7rem;">ARPS</small>
        </a>
        <a th:href="@{/scan}" class="text-center text-decoration-none online-only-feature">
            <div class="scan-btn shadow">
                <i class="bi bi-qr-code-scan fs-4"></i>
            </div>
        </a>
        <a th:href="@{/sales}" class="text-secondary text-center text-decoration-none online-only-feature">
            <i class="bi bi-cart3 nav-icon"></i>
            <small class="d-block" style="font-size: 0.7rem;">Sale</small>
        </a>
        <a th:href="@{/admin/settings}" class="text-secondary text-center text-decoration-none">
            <i class="bi bi-gear nav-icon"></i>
            <small class="d-block" style="font-size: 0.7rem;">Settings</small>
        </a>
    </div>

    <!-- Scripts moved to head -->

    <script>
        $(document).ready(function () {
            $('select.searchable').select2({
                theme: 'bootstrap-5',
                width: '100%',
                placeholder: 'Select option...',
                allowClear: true
            });
        });
    </script>

    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
